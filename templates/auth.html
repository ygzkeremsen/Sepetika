{% extends 'base.html' %}{% block content %}<section class="auth card"><p class="eyebrow">SEPETİKA</p><h1>{{ 'Hesap oluştur' if mode=='register' else 'Tekrar hoş geldiniz' }}</h1><form method="post" class="stack">{% if mode=='register' %}<label>Ad soyad<input name="name" required maxlength="100"></label>{% endif %}<label>E-posta<input type="email" name="email" required></label><label>Parola<input type="password" name="password" minlength="8" required></label><button class="button">{{ 'Kayıt ol' if mode=='register' else 'Giriş yap' }}</button></form><p>{% if mode=='register' %}Hesabınız var mı? <a href="{{ url_for('login') }}">Giriş yapın</a>{% else %}Yeni misiniz? <a href="{{ url_for('register') }}">Hesap oluşturun</a>{% endif %}</p></section>{% endblock %}
